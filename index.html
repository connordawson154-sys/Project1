<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f35">
<title>PoundPlan — Every pound has a purpose</title>
<style>
:root{--green:#173f35;--green2:#246b50;--mint:#e6f4ec;--bg:#f5f7f5;--ink:#17231e;--muted:#69766f;--line:#e1e8e3;--white:#fff;--red:#b93838;--amber:#9a6500;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:84px}.top{background:var(--green);color:white;padding:22px max(18px,calc((100% - 1040px)/2));border-radius:0 0 24px 24px}.brand{display:flex;align-items:center;gap:12px}.logo{height:42px;width:42px;display:grid;place-items:center;background:#fff;color:var(--green);border-radius:13px;font-weight:900;font-size:20px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;color:#d6e7de;font-size:13px}.toprow{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap}.period{background:#ffffff18;border:1px solid #ffffff33;color:white;border-radius:10px;padding:9px 11px}.top small{color:#d6e7de}.content{padding:18px;display:grid;gap:16px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tab{border:1px solid var(--line);background:white;color:var(--muted);padding:10px 13px;border-radius:999px;white-space:nowrap;font-weight:650}.tab.active{background:var(--green);border-color:var(--green);color:white}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:0 2px 8px #183e2d08}.stat-label{font-size:12px;color:var(--muted);font-weight:650}.stat-value{font-size:clamp(20px,3vw,28px);font-weight:800;margin:5px 0 3px;letter-spacing:-.5px}.stat-sub{font-size:12px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-head h2{font-size:18px;margin:0}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750}.primary{background:var(--green);color:white}.secondary{background:var(--mint);color:var(--green)}.danger{background:#fff0f0;color:var(--red)}.smallbtn{padding:6px 9px;font-size:12px}.progress{height:9px;background:#e9eeea;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#37976b;border-radius:99px}.progress.warn span{background:#d5a13d}.progress.over span{background:var(--red)}.rowitem{padding:13px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}.rowitem:first-child{border-top:0}.itemicon{width:40px;height:40px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:19px;flex-shrink:0}.itemmain{flex:1;min-width:0}.itemmain strong{display:block}.muted{color:var(--muted);font-size:12px}.itemamount{text-align:right;white-space:nowrap;font-weight:750}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.empty{color:var(--muted);padding:22px 0;text-align:center}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e1db;background:white;border-radius:10px;padding:11px;color:var(--ink);min-width:0}.field textarea{min-height:72px}.formactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.full{grid-column:1/-1}.notice{background:#fff7e6;border:1px solid #f0dfb5;color:#6c4a00;padding:12px 14px;border-radius:12px;font-size:13px}.goodnotice{background:var(--mint);color:var(--green);padding:12px 14px;border-radius:12px;font-size:13px}.step{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.step:first-child{border-top:0}.stepnum{width:36px;height:36px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:850}.step.done .stepnum{background:var(--green);color:white}.step h3{margin:0 0 3px;font-size:15px}.step p{margin:0;color:var(--muted);font-size:12px}.goalbar{margin-top:8px}.badge{font-size:11px;padding:4px 7px;border-radius:99px;background:var(--mint);color:var(--green);font-weight:750}.hidden{display:none!important}.bottomnav{display:none}.footer{text-align:center;padding:16px;color:var(--muted);font-size:11px}.amount-negative{color:var(--red)}.tag{font-size:11px;background:#f0f3f1;border-radius:6px;padding:3px 6px;color:#526159}
@media(max-width:760px){.content{padding:13px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat-value{font-size:23px}.split{grid-template-columns:1fr}.top{padding:19px 16px}.toprow{margin-top:16px}.desktop-actions{display:none}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(6px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));justify-content:space-around;z-index:5}.bottomnav button{background:none;border:0;color:var(--muted);font-size:10px;font-weight:700;display:grid;gap:3px;justify-items:center}.bottomnav button span{font-size:20px}.bottomnav button.active{color:var(--green)}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.step{grid-template-columns:36px 1fr}.step>.stepaction{grid-column:2}.card{padding:14px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">£</div><div><h1>PoundPlan</h1><p>Every pound has a purpose.</p></div></div>
  <div class="toprow"><div><div id="welcome" style="font-size:20px;font-weight:800">Your money, your plan</div><small>Manual budgeting · GBP (£)</small></div><input class="period" id="monthPicker" type="month" aria-label="Budget month"></div>
</header>
<main class="content">
<nav class="tabs" id="tabs">
<button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="budget">Budget</button><button class="tab" data-tab="transactions">Transactions</button><button class="tab" data-tab="debts">Debt payoff</button><button class="tab" data-tab="goals">Savings goals</button><button class="tab" data-tab="steps">Baby Steps</button><button class="tab" data-tab="settings">Settings & data</button>
</nav>
<div id="view"></div>
<div class="footer">PoundPlan prototype · Data stays in this browser on this device. Export backups regularly.</div>
</main>
<nav class="bottomnav" id="bottomnav">
<button data-tab="overview" class="active"><span>⌂</span>Home</button><button data-tab="budget"><span>▤</span>Budget</button><button data-tab="transactions"><span>＋</span>Activity</button><button data-tab="debts"><span>↘</span>Debt</button><button data-tab="goals"><span>⚑</span>Goals</button>
</nav>
</div>
<div id="modalroot"></div>
<script>
const KEY='poundplan-v1';
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
const todayISO=()=>new Date().toISOString().slice(0,10);
const monthISO=()=>todayISO().slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,10);
const defaultCategories=[
 {id:'rent',name:'Rent / mortgage',icon:'🏠',type:'expense',planned:0},
 {id:'bills',name:'Bills & utilities',icon:'💡',type:'expense',planned:0},
 {id:'food',name:'Food shopping',icon:'🛒',type:'expense',planned:0},
 {id:'fuel',name:'Fuel & transport',icon:'🚗',type:'expense',planned:0},
 {id:'phone',name:'Phone & subscriptions',icon:'📱',type:'expense',planned:0},
 {id:'personal',name:'Personal spending',icon:'👟',type:'expense',planned:0},
 {id:'fun',name:'Eating out & fun',icon:'🎟️',type:'expense',planned:0},
 {id:'debt',name:'Debt repayments',icon:'💳',type:'expense',planned:0},
 {id:'savings',name:'Savings',icon:'🐷',type:'saving',planned:0},
 {id:'buffer',name:'Buffer / other',icon:'🧾',type:'expense',planned:0}
];
const stepsDefault=[
 {n:1,title:'Save a starter emergency fund',desc:'Ramsey Baby Step 1: save a starter emergency fund. The commonly stated US target is $1,000; choose an appropriate GBP target for your circumstances.',target:1000,current:0},
 {n:2,title:'Pay off all debt (except the mortgage)',desc:'List non-mortgage debts smallest balance first and use the debt snowball.',target:0,current:0},
 {n:3,title:'Build a full emergency fund',desc:'Build 3–6 months of essential expenses.',target:0,current:0},
 {n:4,title:'Invest 15% of household income',desc:'Long-term investing after the earlier steps; consider UK pensions and regulated advice.',target:0,current:0},
 {n:5,title:'Save for children’s education',desc:'Adapt this step to your household and priorities.',target:0,current:0},
 {n:6,title:'Pay off the home early',desc:'Make a plan for mortgage overpayments if suitable.',target:0,current:0},
 {n:7,title:'Build wealth and give',desc:'Long-term wealth, generosity and giving goals.',target:0,current:0}
];
function fresh(){return {version:1,settings:{name:'',payFrequency:'weekly',payday:'Friday',payAmount:0,month:monthISO(),currency:'GBP'},categories:defaultCategories.map(x=>({...x})),income:[],transactions:[],debts:[],goals:[],steps:stepsDefault.map(x=>({...x,done:false})),allocations:{}}}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){state=fresh()}
let activeTab='overview';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function month(){return document.getElementById('monthPicker')?.value||state.settings.month||monthISO()}
function inMonth(date,m=month()){return String(date||'').slice(0,7)===m}
function txs(m=month()){return state.transactions.filter(t=>inMonth(t.date,m))}
function incomes(m=month()){return state.income.filter(t=>inMonth(t.date,m))}
function sum(a,fn=x=>x.amount){return a.reduce((s,x)=>s+(Number(fn(x))||0),0)}
function planned(cat){return Number(state.allocations[month()]?.[cat.id] ?? cat.planned ?? 0)}
function spent(cat){return sum(txs().filter(t=>t.type==='expense'&&t.categoryId===cat.id))}
function savedForGoal(g){return sum(state.transactions.filter(t=>t.type==='saving'&&t.goalId===g.id))}
function totals(){let inc=sum(incomes()),budget=sum(state.categories,c=>planned(c)),spentTotal=sum(txs().filter(t=>t.type==='expense')),saved=sum(txs().filter(t=>t.type==='saving'));return {inc,budget,spent:spentTotal,saved,unallocated:inc-budget}}
function fmtDate(d){if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function button(label,action,cls='secondary'){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`}
function section(title,body,action='',actionLabel=''){return `<section class="card"><div class="section-head"><h2>${title}</h2>${action?button(actionLabel,action):''}</div>${body}</section>`}
function progress(current,target){if(!target||target<=0)return 0;return Math.max(0,Math.min(100,current/target*100))}
function overview(){const t=totals();let remain=t.inc-t.spent-t.saved;const cats=state.categories.map(c=>({c,plan:planned(c),spent:spent(c)})).filter(x=>x.plan||x.spent).sort((a,b)=>(b.spent/Math.max(b.plan,1))-(a.spent/Math.max(a.plan,1))).slice(0,6);
return `<div class="stats">
<div class="card"><div class="stat-label">Income this month</div><div class="stat-value">${money(t.inc)}</div><div class="stat-sub">${incomes().length} income entries</div></div>
<div class="card"><div class="stat-label">Budgeted</div><div class="stat-value">${money(t.budget)}</div><div class="stat-sub">Across all categories</div></div>
<div class="card"><div class="stat-label">Spent</div><div class="stat-value">${money(t.spent)}</div><div class="stat-sub">${money(t.budget-t.spent)} budget less spending</div></div>
<div class="card"><div class="stat-label">Unallocated</div><div class="stat-value ${t.unallocated<0?'amount-negative':''}">${money(t.unallocated)}</div><div class="stat-sub">${t.unallocated===0?'Every pound has a job':t.unallocated>0?'Give this money a job':'You have budgeted more than your income'}</div></div>
</div>
<div class="split">${section('Budget progress',cats.length?cats.map(({c,plan,spent:s})=>`<div class="rowitem"><div class="itemicon">${c.icon||'£'}</div><div class="itemmain"><strong>${esc(c.name)}</strong><div class="progress ${s>plan?'over':s>plan*.8?'warn':''}" style="margin-top:7px"><span style="width:${plan?Math.min(100,s/plan*100):s?100:0}%"></span></div><div class="muted">${money(s)} spent of ${money(plan)}</div></div><div class="itemamount">${money(plan-s)}</div></div>`).join(''):'<div class="empty">Set your category budgets to start tracking progress.</div>','budget','Edit budget')}
${section('Quick actions',`<div class="rowitem"><div class="itemicon">＋</div><div class="itemmain"><strong>Add a transaction</strong><div class="muted">Log spending, savings or income manually.</div></div>${button('Add','add-tx','primary')}</div><div class="rowitem"><div class="itemicon">£</div><div class="itemmain"><strong>Plan your payday</strong><div class="muted">Record pay and assign it to categories.</div></div>${button('Plan','add-income')}</div><div class="rowitem"><div class="itemicon">↘</div><div class="itemmain"><strong>Debt snowball</strong><div class="muted">Track balances and repayments.</div></div>${button('View','debts')}</div>`)}
</div>
${section('Recent activity',recentTx(5),'transactions','All activity')}
<div class="notice">Prototype note: your information is stored in this browser on this device only. It is not synced between devices. Export a backup in Settings & data.</div>`}
function recentTx(limit=50){let arr=[...txs().map(x=>({...x,kind:'tx'})),...incomes().map(x=>({...x,kind:'income',type:'income'}))].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,limit);if(!arr.length)return '<div class="empty">No activity yet. Add your first pay entry or transaction.</div>';return arr.map(x=>{let cat=state.categories.find(c=>c.id===x.categoryId);return `<div class="rowitem"><div class="itemicon">${x.kind==='income'?'💷':x.type==='saving'?'🐷':cat?.icon||'🧾'}</div><div class="itemmain"><strong>${esc(x.description||x.source||cat?.name||'Transaction')}</strong><div class="muted">${fmtDate(x.date)} · ${x.kind==='income'?'Income':x.type==='saving'?'Savings':cat?.name||'Expense'}</div></div><div class="itemamount ${x.type==='expense'?'':' '}" style="color:${x.type==='expense'?'var(--red)':'var(--green)'}">${x.type==='expense'?'−':'+'}${money(x.amount)}</div><button class="btn danger smallbtn" data-action="delete-${x.kind}" data-id="${x.id}" aria-label="Delete">×</button></div>`}).join('')}
function budgetView(){const t=totals();const summary=`<div class="goodnotice">Zero-based budgeting: allocate your take-home income before spending it. Aim for <strong>Unallocated = £0</strong>, without allocating money you don't have.</div><div class="stats"><div class="card"><div class="stat-label">Income</div><div class="stat-value">${money(t.inc)}</div></div><div class="card"><div class="stat-label">Planned</div><div class="stat-value">${money(t.budget)}</div></div><div class="card"><div class="stat-label">Unallocated</div><div class="stat-value ${t.unallocated<0?'amount-negative':''}">${money(t.unallocated)}</div></div><div class="card"><div class="stat-label">Overspent categories</div><div class="stat-value">${state.categories.filter(c=>spent(c)>planned(c)).length}</div></div></div>`;const rows=state.categories.map(c=>`<div class="rowitem"><div class="itemicon">${esc(c.icon||'£')}</div><div class="itemmain"><strong>${esc(c.name)}</strong><div class="muted">${c.type==='saving'?'Savings allocation':'Spending category'} · ${money(spent(c))} used</div></div><div style="width:125px"><div class="field"><label>Budget (£)</label><input type="number" min="0" step=".01" value="${planned(c)}" data-allocation="${c.id}" aria-label="${esc(c.name)} budget"></div></div><button class="btn danger smallbtn" data-action="delete-category" data-id="${c.id}">×</button></div>`).join('')+`<div class="formactions">${button('＋ Add category','add-category')}${button('Copy last month','copy-budget')}</div>`;return summary+section('Your categories',rows)}
function txView(){return `${section('Add a transaction',txForm())}${section('Activity for '+esc(month()),recentTx(100))}`}
function txForm(){return `<form id="txform"><div class="formgrid"><div class="field"><label>Type</label><select name="type" id="txtype"><option value="expense">Spending</option><option value="saving">Savings contribution</option></select></div><div class="field"><label>Amount (£)</label><input required name="amount" type="number" min=".01" step=".01" placeholder="e.g. 18.50"></div><div class="field"><label>Date</label><input required name="date" type="date" value="${todayISO()}"></div><div class="field"><label>Category</label><select name="categoryId">${state.categories.map(c=>`<option value="${c.id}">${esc(c.icon)} ${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>Description</label><input name="description" placeholder="e.g. Weekly food shop"></div><div class="field full hidden" id="goalfield"><label>Savings goal (optional)</label><select name="goalId"><option value="">General savings</option>${state.goals.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div></div><div class="formactions"><button class="btn primary" type="submit">Save transaction</button></div></form>`}
function incomeForm(){return `<form id="incomeform"><div class="formgrid"><div class="field"><label>Pay / income source</label><input name="source" required placeholder="e.g. Weekly wages"></div><div class="field"><label>Amount received (£)</label><input name="amount" required type="number" min=".01" step=".01" placeholder="Take-home pay"></div><div class="field"><label>Payday date</label><input name="date" type="date" required value="${todayISO()}"></div><div class="field"><label>Note (optional)</label><input name="note" placeholder="e.g. Overtime included"></div></div><div class="formactions"><button class="btn primary" type="submit">Save income</button></div></form>`}
function transactionsView(){return `${section('Record income',incomeForm())}${section('Record spending or savings',txForm())}${section('Transactions this month',recentTx(100))}`}
function debtsView(){let debts=[...state.debts].sort((a,b)=>a.balance-b.balance);let total=sum(debts,d=>d.balance),min=sum(debts,d=>d.minimum);return `<div class="stats"><div class="card"><div class="stat-label">Total debt remaining</div><div class="stat-value">${money(total)}</div></div><div class="card"><div class="stat-label">Minimum monthly payments</div><div class="stat-value">${money(min)}</div></div><div class="card"><div class="stat-label">Number of debts</div><div class="stat-value">${debts.length}</div></div><div class="card"><div class="stat-label">Snowball order</div><div class="stat-value">${debts.length?'Smallest first':'—'}</div></div></div>${section('Your debt snowball',debts.length?debts.map((d,i)=>`<div class="rowitem"><div class="itemicon">${i===0?'🎯':'💳'}</div><div class="itemmain"><strong>${esc(d.name)} ${i===0?'<span class="badge">Snowball target</span>':''}</strong><div class="muted">APR ${Number(d.apr)||0}% · Minimum ${money(d.minimum)} / month</div><div class="progress" style="margin-top:7px"><span style="width:${d.startBalance?Math.max(0,Math.min(100,(1-d.balance/d.startBalance)*100)):0}%"></span></div><div class="muted">${money(Math.max(0,d.startBalance-d.balance))} paid off of ${money(d.startBalance)}</div></div><div class="itemamount">${money(d.balance)}<div class="muted">remaining</div></div><button class="btn secondary smallbtn" data-action="pay-debt" data-id="${d.id}">Pay</button><button class="btn danger smallbtn" data-action="delete-debt" data-id="${d.id}">×</button></div>`).join(''):'<div class="empty">Add your debts, starting with the smallest balance.</div>','add-debt','＋ Add debt')}${section('Debt snowball method','<p class="muted">Pay minimums on all debts, then put any extra debt-payment money towards the smallest balance. When it is cleared, roll that payment into the next debt. This tracker does not calculate interest or replace lender statements.')}`}
function goalsView(){return `<div class="stats"><div class="card"><div class="stat-label">Savings goals</div><div class="stat-value">${state.goals.length}</div></div><div class="card"><div class="stat-label">Saved towards goals</div><div class="stat-value">${money(sum(state.goals,g=>savedForGoal(g)))}</div></div><div class="card"><div class="stat-label">Goal targets</div><div class="stat-value">${money(sum(state.goals,g=>g.target))}</div></div><div class="card"><div class="stat-label">Remaining</div><div class="stat-value">${money(sum(state.goals,g=>Math.max(0,g.target-savedForGoal(g))))}</div></div></div>${section('Your savings goals',state.goals.length?state.goals.map(g=>{let s=savedForGoal(g),p=progress(s,g.target);return `<div class="rowitem"><div class="itemicon">🎯</div><div class="itemmain"><strong>${esc(g.name)}</strong><div class="muted">Target ${money(g.target)}${g.date?' · By '+fmtDate(g.date):''}</div><div class="progress goalbar"><span style="width:${p}%"></span></div><div class="muted">${money(s)} saved · ${Math.round(p)}%</div></div><div class="itemamount">${money(Math.max(0,g.target-s))}<div class="muted">to go</div></div><button class="btn secondary smallbtn" data-action="contribute" data-id="${g.id}">＋</button><button class="btn danger smallbtn" data-action="delete-goal" data-id="${g.id}">×</button></div>`}).join(''):'<div class="empty">Create a goal for your emergency fund, house deposit or something important to you.</div>','add-goal','＋ Add goal')}`}
function stepsView(){return `<div class="goodnotice">Dave Ramsey's Baby Steps are US-origin guidance. PoundPlan lets you adapt the targets to UK costs and your own circumstances; the steps are educational prompts, not personalised financial advice.</div>${section('Your Baby Steps',state.steps.map(s=>`<div class="step ${s.done?'done':''}"><div class="stepnum">${s.done?'✓':s.n}</div><div><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p>${s.target>0?`<div class="muted" style="margin-top:5px">${money(s.current)} of ${money(s.target)}</div><div class="progress goalbar"><span style="width:${progress(s.current,s.target)}%"></span></div>`:`<div class="muted" style="margin-top:5px">${s.n===2?'Debts remaining: '+money(sum(state.debts,d=>d.balance)):''}</div>`}</div><div class="stepaction">${s.target>0?button('Update','step-update-'+s.n,'secondary smallbtn'):''}<button class="btn ${s.done?'secondary':'primary'} smallbtn" data-action="toggle-step" data-id="${s.n}">${s.done?'Undo':'Mark done'}</button></div></div>`).join(''))}`}
function settingsView(){return `${section('Your preferences',`<form id="settingsform"><div class="formgrid"><div class="field"><label>Your name (optional)</label><input name="name" value="${esc(state.settings.name)}" placeholder="e.g. Alex"></div><div class="field"><label>Pay frequency</label><select name="payFrequency">${[['weekly','Weekly'],['fortnightly','Every 2 weeks'],['fourweekly','Every 4 weeks'],['monthly','Monthly'],['irregular','Irregular']].map(([v,l])=>`<option value="${v}" ${state.settings.payFrequency===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Usual payday</label><select name="payday">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Varies'].map(x=>`<option ${state.settings.payday===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Usual take-home pay (£)</label><input name="payAmount" type="number" min="0" step=".01" value="${Number(state.settings.payAmount)||''}" placeholder="Enter take-home pay"></div></div><div class="formactions"><button class="btn primary">Save preferences</button></div></form>`)}
${section('Backup and restore',`<p class="muted">Export a JSON backup before changing devices or clearing browser data. The backup contains your budget and transactions, so keep it somewhere private.</p><div class="formactions">${button('Export backup','export','primary')}<label class="btn secondary" for="importfile">Import backup</label><input class="hidden" id="importfile" type="file" accept="application/json"></div><div class="formactions">${button('Clear all app data','clear-data','danger')}</div>`)}
<div class="notice">Privacy: this prototype stores data in local browser storage. It has no login, cloud sync, encryption layer, or server backup. Do not use it as a public service for real users until authentication, secure server-side storage, privacy terms, data deletion, and security testing are implemented.</div>`}
function render(){document.getElementById('monthPicker').value=state.settings.month||monthISO();document.getElementById('welcome').textContent=state.settings.name?`Hello, ${state.settings.name}`:'Your money, your plan';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));let v=document.getElementById('view');v.innerHTML=({overview,budget:budgetView,transactions:transactionsView,debts:debtsView,goals:goalsView,steps:stepsView,settings:settingsView}[activeTab]||overview)();if(activeTab==='transactions')wireTxForm();wireIncomeForm();wireSettings();wireAllocation();wireImport();document.querySelectorAll('#view form').forEach(f=>{if(f.id==='txform'||f.id==='incomeform'||f.id==='settingsform')return;});}
function switchTab(t){activeTab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
function modal(title,body){document.getElementById('modalroot').innerHTML=`<div style="position:fixed;inset:0;background:#10251dcc;z-index:10;display:grid;place-items:center;padding:18px" id="modalback"><div class="card" style="width:min(500px,100%);max-height:90vh;overflow:auto"><div class="section-head"><h2>${title}</h2><button class="btn secondary" data-action="close-modal">Close</button></div>${body}</div></div>`}
function wireTxForm(){let f=document.getElementById('txform');if(!f)return;f.addEventListener('change',e=>{if(e.target.id==='txtype')document.getElementById('goalfield')?.classList.toggle('hidden',e.target.value!=='saving')});f.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let amt=Number(d.amount);if(!(amt>0))return alert('Enter an amount greater than £0.');state.transactions.push({id:uid(),type:d.type,amount:amt,date:d.date,categoryId:d.categoryId,description:d.description.trim(),goalId:d.goalId||''});save();render()})}
function wireIncomeForm(){let f=document.getElementById('incomeform');if(!f)return;f.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let amt=Number(d.amount);if(!(amt>0))return alert('Enter an amount greater than £0.');state.income.push({id:uid(),source:d.source.trim(),amount:amt,date:d.date,note:d.note.trim()});save();render()})}
function wireSettings(){let f=document.getElementById('settingsform');if(!f)return;f.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));state.settings={...state.settings,...d,payAmount:Number(d.payAmount)||0};save();render()})}
function wireAllocation(){document.querySelectorAll('[data-allocation]').forEach(inp=>inp.addEventListener('change',()=>{let id=inp.dataset.allocation,v=Math.max(0,Number(inp.value)||0);state.allocations[month()]??={};state.allocations[month()][id]=v;save();render()}))}
function wireImport(){let i=document.getElementById('importfile');if(!i)return;i.addEventListener('change',async()=>{let file=i.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||obj.version!==1||!Array.isArray(obj.categories)||!Array.isArray(obj.transactions))throw Error('This does not look like a PoundPlan backup.');if(confirm('Replace current PoundPlan data with this backup?')){state=obj;save();render();alert('Backup imported.')}}catch(e){alert('Could not import backup: '+e.message)}})}
let pendingAmountAction=null; function askAmount(title,label,initial=''){modal(title,`<form id="simpleform"><div class="field"><label>${label}</label><input name="amount" type="number" min="0" step=".01" required value="${initial}"></div><div class="formactions"><button class="btn primary">Save</button></div></form>`);document.getElementById('simpleform').addEventListener('submit',e=>{e.preventDefault();let val=Number(new FormData(e.target).get('amount'));if(val<0||!Number.isFinite(val))return alert('Enter a valid amount.');if(pendingAmountAction)pendingAmountAction(val);pendingAmountAction=null;document.getElementById('modalroot').innerHTML='';save();render()})}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-action]');if(!b)return;if(b.dataset.tab){switchTab(b.dataset.tab);return}let a=b.dataset.action,id=b.dataset.id;
if(a==='add-tx'){switchTab('transactions');setTimeout(()=>document.getElementById('txtype')?.focus(),50)}
else if(a==='add-income'){switchTab('transactions');setTimeout(()=>document.querySelector('#incomeform input[name=source]')?.focus(),50)}
else if(a==='debts')switchTab('debts');else if(a==='budget')switchTab('budget');else if(a==='transactions')switchTab('transactions');
else if(a==='add-category')modal('Add a category',`<form id="categoryform"><div class="formgrid"><div class="field"><label>Category name</label><input name="name" required></div><div class="field"><label>Icon (emoji)</label><input name="icon" value="📦" maxlength="4"></div><div class="field"><label>Type</label><select name="type"><option value="expense">Spending</option><option value="saving">Savings</option></select></div></div><div class="formactions"><button class="btn primary">Add category</button></div></form>`);
else if(a==='add-debt')modal('Add a debt',`<form id="debtform"><div class="formgrid"><div class="field full"><label>Debt name</label><input name="name" required placeholder="e.g. Credit card"></div><div class="field"><label>Current balance (£)</label><input name="balance" required type="number" min="0" step=".01"></div><div class="field"><label>APR (%)</label><input name="apr" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Minimum monthly payment (£)</label><input name="minimum" type="number" min="0" step=".01" value="0"></div></div><div class="formactions"><button class="btn primary">Add debt</button></div></form>`);
else if(a==='add-goal')modal('Add a savings goal',`<form id="goalform"><div class="formgrid"><div class="field full"><label>Goal name</label><input name="name" required placeholder="e.g. Emergency fund"></div><div class="field"><label>Target (£)</label><input name="target" required type="number" min=".01" step=".01"></div><div class="field"><label>Target date (optional)</label><input name="date" type="date"></div></div><div class="formactions"><button class="btn primary">Add goal</button></div></form>`);
else if(a==='contribute'){let g=state.goals.find(x=>x.id===id);pendingAmountAction=val=>state.transactions.push({id:uid(),type:'saving',amount:val,date:todayISO(),categoryId:state.categories.find(c=>c.type==='saving')?.id||state.categories[0]?.id,description:'Contribution: '+g.name,goalId:g.id});askAmount('Contribute to '+esc(g.name),'Amount to save (£)')}
else if(a==='pay-debt'){let d=state.debts.find(x=>x.id===id);pendingAmountAction=val=>{d.balance=Math.max(0,d.balance-val);state.transactions.push({id:uid(),type:'expense',amount:val,date:todayISO(),categoryId:state.categories.find(c=>c.id==='debt')?.id||state.categories[0]?.id,description:'Debt payment: '+d.name});};askAmount('Record debt payment','Payment amount (£)')}
else if(a==='delete-tx'){state.transactions=state.transactions.filter(x=>x.id!==id);save();render()}
else if(a==='delete-income'){state.income=state.income.filter(x=>x.id!==id);save();render()}
else if(a==='delete-category'){if(state.transactions.some(t=>t.categoryId===id))return alert('This category has transactions. Reassign or delete them first.');if(confirm('Delete this category?')){state.categories=state.categories.filter(c=>c.id!==id);save();render()}}
else if(a==='delete-debt'){if(confirm('Delete this debt from the tracker?')){state.debts=state.debts.filter(x=>x.id!==id);save();render()}}
else if(a==='delete-goal'){if(confirm('Delete this savings goal? Contributions will remain in your transactions.')){state.goals=state.goals.filter(x=>x.id!==id);save();render()}}
else if(a==='copy-budget'){let prev=new Date(month()+'-15T12:00:00');prev.setMonth(prev.getMonth()-1);let pm=prev.toISOString().slice(0,7);state.allocations[month()]??={};state.categories.forEach(c=>state.allocations[month()][c.id]=Number(state.allocations[pm]?.[c.id]??c.planned??0));save();render()}
else if(a==='toggle-step'){let s=state.steps.find(x=>x.n===Number(id));if(s){s.done=!s.done;save();render()}}
else if(a.startsWith('step-update-')){let n=Number(a.split('-').pop()),s=state.steps.find(x=>x.n===n);pendingAmountAction=val=>{s.current=val;s.done=s.target>0&&val>=s.target};askAmount('Update Baby Step '+n,'Amount saved / progress (£)',s.current)}
else if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='poundplan-backup-'+todayISO()+'.json';link.click();URL.revokeObjectURL(url)}
else if(a==='clear-data'){if(confirm('This permanently clears all PoundPlan data stored in this browser. Export a backup first. Continue?')){state=fresh();save();render()}}
else if(a==='close-modal'){document.getElementById('modalroot').innerHTML=''}
});
document.addEventListener('submit',e=>{if(e.target.id==='categoryform'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.categories.push({id:uid(),name:d.name.trim(),icon:d.icon||'📦',type:d.type,planned:0});save();document.getElementById('modalroot').innerHTML='';render()}
if(e.target.id==='debtform'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),bal=Number(d.balance)||0;state.debts.push({id:uid(),name:d.name.trim(),balance:bal,startBalance:bal,apr:Number(d.apr)||0,minimum:Number(d.minimum)||0});save();document.getElementById('modalroot').innerHTML='';render()}
if(e.target.id==='goalform'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.goals.push({id:uid(),name:d.name.trim(),target:Number(d.target)||0,date:d.date||''});save();document.getElementById('modalroot').innerHTML='';render()}
});
document.getElementById('monthPicker').addEventListener('change',e=>{state.settings.month=e.target.value;save();render()});
save();render();
</script>
</body>
</html>
